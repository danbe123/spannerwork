name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend Jobs
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage
        run: npm test -- --run --coverage
      
      - name: Check coverage thresholds
        run: |
          # Extract coverage percentages from coverage-summary.json
          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            LINES=$(cat $COVERAGE_FILE | jq '.total.lines.pct')
            FUNCTIONS=$(cat $COVERAGE_FILE | jq '.total.functions.pct')
            BRANCHES=$(cat $COVERAGE_FILE | jq '.total.branches.pct')
            STATEMENTS=$(cat $COVERAGE_FILE | jq '.total.statements.pct')
            
            echo "Coverage Report:"
            echo "  Lines: $LINES%"
            echo "  Functions: $FUNCTIONS%"
            echo "  Branches: $BRANCHES%"
            echo "  Statements: $STATEMENTS%"
            
            # Minimum thresholds (80%)
            MIN_THRESHOLD=80

            # Check if any metric is below threshold
            if (( $(echo "$LINES < $MIN_THRESHOLD" | bc -l) )) || \
               (( $(echo "$STATEMENTS < $MIN_THRESHOLD" | bc -l) )); then
              echo "❌ Coverage is below minimum threshold of ${MIN_THRESHOLD}%"
              exit 1
            fi
            echo "✅ Coverage meets minimum threshold of ${MIN_THRESHOLD}%"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # Backend Jobs
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spannerwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spannerwork_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      SESSION_SECRET: test-session-secret-minimum-32-chars
      CSRF_SECRET: test-csrf-secret-minimum-32-chars-here
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma client
        run: npx prisma generate
      
      - name: Run database migrations
        run: npx prisma migrate deploy
      
      - name: Run tests with coverage
        run: npm run test:coverage -- --run
      
      - name: Check coverage thresholds
        run: |
          # Extract coverage percentages from coverage-summary.json
          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            LINES=$(cat $COVERAGE_FILE | jq '.total.lines.pct')
            FUNCTIONS=$(cat $COVERAGE_FILE | jq '.total.functions.pct')
            BRANCHES=$(cat $COVERAGE_FILE | jq '.total.branches.pct')
            STATEMENTS=$(cat $COVERAGE_FILE | jq '.total.statements.pct')
            
            echo "Coverage Report:"
            echo "  Lines: $LINES%"
            echo "  Functions: $FUNCTIONS%"
            echo "  Branches: $BRANCHES%"
            echo "  Statements: $STATEMENTS%"
            
            # Minimum thresholds (80%)
            MIN_THRESHOLD=80

            # Check if any metric is below threshold
            if (( $(echo "$LINES < $MIN_THRESHOLD" | bc -l) )) || \
               (( $(echo "$STATEMENTS < $MIN_THRESHOLD" | bc -l) )); then
              echo "❌ Coverage is below minimum threshold of ${MIN_THRESHOLD}%"
              exit 1
            fi
            echo "✅ Coverage meets minimum threshold of ${MIN_THRESHOLD}%"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 7

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma client
        run: npx prisma generate
      
      - name: Build
        run: npm run build

  # E2E Tests (only on main branch and PRs)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spannerwork_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spannerwork_e2e
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      SESSION_SECRET: test-session-secret-minimum-32-chars
      CSRF_SECRET: test-csrf-secret-minimum-32-chars-here
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Generate Prisma client
        run: cd backend && npx prisma generate
      
      - name: Run database migrations
        run: cd backend && npx prisma migrate deploy
      
      - name: Start backend server
        run: cd backend && npm run dev &
        env:
          PORT: 3000
      
      - name: Wait for backend
        run: npx wait-on http://localhost:3000/health -t 30000
      
      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run npm audit (frontend)
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Run npm audit (backend)
        run: cd backend && npm audit --audit-level=high
        continue-on-error: true
